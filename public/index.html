<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-audience="adult">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="meta-theme-color" content="#0a0e14" />
  <meta
    name="description"
    content="Interactive Marvel Multiverse &amp; Omnibus Portal — Explore X-Men, Avengers, Spider-Verse, Fantastic Four, 215+ playable Multiverse Variants, Official 1-7 Power Grids, 1v1 Battleworld Arena, Nexus Map &amp; Infinity Forge."
  />
  <meta property="og:title" content="Marvel Multiverse &amp; Omnibus Atlas" />
  <meta
    property="og:description"
    content="Explore 76 Marvel legends and 215+ playable Multiverse Variants across Earth-616, Earth-1610, Age of Apocalypse, 2099, Battleworld &amp; Earth-6160."
  />
  <meta property="og:type" content="website" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';"
  />
  <title>Marvel Multiverse &amp; Omnibus Atlas · X-Men, Avengers &amp; Variants</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/dashboard.css" />
</head>
<body>
  <a href="#main-workspace" id="skip-link" class="skip-link">Skip to main portal</a>

  <header class="atlas-header">
    <div class="brand-cluster">
      <div id="marvel-crest" class="marvel-crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" class="ui-icon-svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2" />
          <path d="M7.5 17 L12 6.5 L16.5 17 M9.2 13.5 H14.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div>
        <div class="brand-title-row">
          <h1 id="brand-title" class="brand-title">MARVEL MULTIVERSE ATLAS</h1>
          <span class="brand-edition-tag">OHOTMU · 616 → OMNIVERSE</span>
        </div>
        <p id="brand-subtitle" class="brand-subtitle">
          X-Men • Avengers • Spider-Verse • Fantastic Four • 215+ Multiverse Variants &amp; OHOTMU Power Grid
        </p>
      </div>
    </div>

    <div class="header-controls" role="group" aria-label="Portal Controls">
      <div class="control-pill">
        <label for="lang-select" id="lang-label" class="control-label">Lang:</label>
        <select id="lang-select" class="atlas-select" aria-label="Language">
          <option value="en" selected>EN · English</option>
          <option value="es">ES · Español</option>
          <option value="zh">中文 · 简体</option>
          <option value="yue">粵語 · 廣東話</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="pt">PT · Português</option>
          <option value="fr">FR · Français</option>
          <option value="it">IT · Italiano</option>
          <option value="de">DE · Deutsch</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="audience-switcher" role="group" aria-label="Reading Depth">
        <button
          type="button"
          id="btn-mode-adult"
          class="mode-btn active"
          aria-pressed="true"
          title="Deep Official Handbook (OHOTMU) continuity, issue citations &amp; scaling lore for aficionados"
        >
          Omnibus Lore
        </button>
        <button
          type="button"
          id="btn-mode-kid"
          class="mode-btn"
          aria-pressed="false"
          title="Action-packed, accessible summaries for young fans &amp; newcomers"
        >
          Young Hero
        </button>
      </div>

      <div class="control-pill">
        <label for="era-select" id="era-label" class="control-label">Saga Shield:</label>
        <select id="era-select" class="atlas-select" aria-label="Select Marvel Publication Era Spoiler Shield">
          <option id="era-opt-multiverse" value="multiverse" selected>Multiverse &amp; Krakoa (All)</option>
          <option id="era-opt-modern" value="modern">Modern &amp; Incursions (2000–2014)</option>
          <option id="era-opt-bronze" value="bronze">Claremont &amp; Infinity (1980–1999)</option>
          <option id="era-opt-silver" value="silver">Golden &amp; Silver Age (1939–1979)</option>
        </select>
      </div>

      <div class="control-pill voice-persona-pill">
        <label for="chirp-persona-select" id="chirp-label" class="control-label">Voice:</label>
        <select id="chirp-persona-select" class="atlas-select" aria-label="Chirp 3 HD Voice Persona">
          <option value="auto" selected>Auto Archetype</option>
          <option value="Fenrir">Fenrir (Titan / Thunder)</option>
          <option value="Charon">Charon (Sorcerer / Sovereign)</option>
          <option value="Orus">Orus (Tactician / Genius)</option>
          <option value="Puck">Puck (Web-Slinger / Agile)</option>
          <option value="Aoede">Aoede (Telepath / Mystic)</option>
          <option value="Kore">Kore (Regent / Commander)</option>
          <option value="Leda">Leda (Cosmic / Champion)</option>
          <option value="Zephyr">Zephyr (Watcher / Chronicler)</option>
        </select>
      </div>

      <button type="button" id="btn-read-aloud" class="action-pill-btn" aria-pressed="false">
        Narrate
      </button>

      <button type="button" id="btn-share-link" class="action-pill-btn" title="Copy deep link to current Hero, Multiverse Variant, or 1v1 Matchup">
        Share Link
      </button>
      <span id="share-toast" class="share-toast" role="status" aria-live="polite" hidden></span>

      <div id="theme-switcher" class="audience-switcher" role="group" aria-label="Color Theme">
        <button type="button" id="btn-theme-dark" class="mode-btn active" aria-pressed="true" title="S.W.O.R.D. / Nexus Night">
          Night
        </button>
        <button type="button" id="btn-theme-light" class="mode-btn" aria-pressed="false" title="1963 Four-Color Newsprint">
          Newsprint
        </button>
      </div>
    </div>
  </header>

  <nav class="atlas-tabs" role="tablist" aria-label="Marvel Multiverse Sections">
    <button type="button" class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-panel-host" tabindex="0" data-tab="characters" id="tab-characters">
      Roster &amp; Variants
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="arena" id="tab-arena">
      1v1 Battleworld
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="xmen" id="tab-xmen">
      X-Men &amp; Omega
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="multiverse" id="tab-multiverse">
      Multiverse Map
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="factions" id="tab-factions">
      Teams &amp; Cabals
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="forge" id="tab-forge">
      Infinity Forge &amp; Quiz
    </button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-panel-host" tabindex="-1" data-tab="vault" id="tab-vault">
      Cover Vault
    </button>
  </nav>

  <section id="kpi-strip" class="kpi-strip" aria-label="Omniverse Telemetry Summary"></section>

  <main id="main-workspace" class="main-workspace">
    <div id="tab-panel-host" class="tab-panel-host" role="tabpanel" aria-labelledby="tab-characters"></div>
    <aside id="detail-inspector" class="detail-inspector" aria-label="Selected Character and Variant Dossier"></aside>
  </main>

  <div id="inspector-scrim" class="inspector-scrim" hidden aria-hidden="true"></div>
  <div id="mobile-dossier-bar" class="mobile-dossier-bar" role="region" aria-label="Selected Character Quick Bar"></div>

  <div
    id="collector-lightbox"
    class="collector-lightbox"
    hidden
    role="dialog"
    aria-modal="true"
    aria-label="Comic Cover Collector Loupe"
  ></div>

  <script src="./js/data/world.js"></script>
  <script src="./js/data/characters.js"></script>
  <script src="./js/data/index.js"></script>
  <script src="./js/data/artwork.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/ui/dom.js"></script>
  <script src="./js/ui/map.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
